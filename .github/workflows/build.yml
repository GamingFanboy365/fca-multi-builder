name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Build all platforms, test on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install compilers and mGBA
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64 libmgba-dev zip
      - name: Build (Linux, Win32, Win64)
        run: make all-platforms
      - name: Test suite
        run: make test
      - name: Boot tests in mGBA
        run: make emu-test
      - name: Release zips
        run: make dist
      - uses: actions/upload-artifact@v4
        with:
          name: fca-multi-builder
          path: dist/*.zip

  windows:
    name: Test on Windows (${{ matrix.arch }})
    needs: linux
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [win32, win64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fca-multi-builder
          path: dist
      - name: Run the test suite against the release .exe files
        shell: bash
        run: |
          cd dist
          unzip -q fca-multi-builder-*-${{ matrix.arch }}.zip
          cd ..
          python tests/run_tests.py dist/fca-multi-builder-*-${{ matrix.arch }}/

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fca-multi-builder
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
